<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Chef's Table{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #26332d;
        --muted: #69766f;
        --leaf: #28634d;
        --leaf-dark: #1d4e3b;
        --paper: #f5f7f2;
        --line: #e4e9e1;
      }

      body {
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      .topbar {
        background: #fff;
        border-bottom: 1px solid var(--line);
      }

      .brand-mark {
        color: var(--leaf-dark);
        font-size: 1.15rem;
        font-weight: 800;
        letter-spacing: 0;
      }

      .nav-link {
        color: var(--muted);
        font-weight: 600;
      }

      .nav-link:hover,
      .nav-link.active {
        color: var(--leaf-dark);
      }

      .page-shell {
        max-width: 1120px;
        padding-top: 2.5rem;
        padding-bottom: 3rem;
      }

      .page-title {
        font-size: clamp(1.75rem, 2.4vw, 2.25rem);
        font-weight: 750;
        letter-spacing: 0;
      }

      .page-subtitle,
      .text-muted-custom {
        color: var(--muted);
      }

      .surface {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      .section-title {
        font-size: 1.05rem;
        font-weight: 700;
      }

      .btn-success {
        --bs-btn-bg: var(--leaf);
        --bs-btn-border-color: var(--leaf);
        --bs-btn-hover-bg: var(--leaf-dark);
        --bs-btn-hover-border-color: var(--leaf-dark);
        --bs-btn-active-bg: var(--leaf-dark);
        --bs-btn-active-border-color: var(--leaf-dark);
      }

      .form-label {
        font-weight: 650;
      }

      .form-control,
      .form-select {
        border-color: #d7dfd6;
        min-height: 44px;
      }

      textarea.form-control {
        min-height: 96px;
      }

      .form-control:focus,
      .form-select:focus {
        border-color: #6b9b80;
        box-shadow: 0 0 0 0.2rem rgb(40 99 77 / 14%);
      }

      .table > :not(caption) > * > * {
        padding: 0.95rem 1rem;
      }

      .table thead th {
        background: #f7f9f6;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status-badge {
        background: #edf5ef;
        color: var(--leaf-dark);
        font-weight: 650;
      }

      @media (max-width: 575.98px) {
        .page-shell {
          padding-top: 1.5rem;
        }
      }
    </style>
    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <nav class="topbar navbar navbar-expand-sm">
      <div class="container page-shell py-0">
        <a class="navbar-brand brand-mark" href="{% url 'home' %}"
          >Chef's Table</a
        >
        <div class="navbar-nav ms-auto flex-row gap-3">
          <a class="nav-link" href="{% url 'home' %}">Dashboard</a>
          <a class="nav-link" href="{% url 'kitchen_orders' %}">Orders</a>
          {% if user.is_authenticated %}
          <span class="nav-link">{{ user.email }}</span>
          <form class="d-flex" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="nav-link border-0 bg-transparent" type="submit">
              Log out
            </button>
          </form>
          {% else %}
          <a class="nav-link" href="{% url 'login' %}">Log in</a>
          <a class="nav-link" href="{% url 'register' %}">Register</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container page-shell">{% block content %}{% endblock %}</main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
